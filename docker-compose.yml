services:
  postgres:
    image: postgres:16
    container_name: jobcopilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobcopilot
      POSTGRES_PASSWORD: jobcopilot
      POSTGRES_DB: jobcopilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
